<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Etkinlik Takvimi</title>
<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#090806;
    font-family:Arial,Helvetica,sans-serif;
    color:#d8bd68;
}
.calendar{
    width:100%;
    height:100%;
    padding:9px 10px 10px;
    background:
      linear-gradient(rgba(10,10,10,.72),rgba(10,10,10,.82)),
      radial-gradient(circle at 22% 10%,rgba(255,255,255,.10),transparent 46%),
      #11100e;
    border:1px solid #76683d;
}
.title{
    height:28px;
    line-height:23px;
    padding:0 4px 5px;
    border-bottom:1px solid #8b7641;
    font-size:14px;
    color:#d9bf6d;
    white-space:nowrap;
}
.title .icon{margin-right:7px}
.list{
    height:calc(100% - 31px);
    padding-top:6px;
    display:flex;
    flex-direction:column;
    gap:5px;
}
.row{
    min-height:0;
    flex:1 1 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6px 0 14px;
    background:linear-gradient(90deg,rgba(31,31,30,.96),rgba(20,20,20,.92));
    border-bottom:1px solid #8a753d;
    border-radius:3px 0 0 3px;
}
.name{
    padding-right:8px;
    font-size:12px;
    color:#e0c55e;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}
.when{
    flex:0 0 auto;
    padding:3px 7px;
    background:#9a8449;
    color:#19150d;
    font-size:11px;
    line-height:1;
    white-space:nowrap;
}
.error{
    padding:14px;
    color:#d9bf6d;
    font-size:12px;
}
</style>
</head>
<body>
<div class="calendar">
    <div class="title"><span class="icon">🗓️</span>Etkinlik Takvimi</div>
    <div id="list" class="list"></div>
</div>

<script>
(function () {
    var list = document.getElementById("list");

    function esc(s) {
        return String(s)
            .replace(/&/g,"&amp;")
            .replace(/</g,"&lt;")
            .replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;");
    }

    function render(data) {
        list.innerHTML = "";
        for (var i = 0; i < data.length; i++) {
            var e = data[i];
            var row = document.createElement("div");
            row.className = "row";
            row.innerHTML =
                '<div class="name">' + esc(e.name) + '</div>' +
                '<div class="when">' + esc(e.day) + ' ' + esc(e.time) + '</div>';
            list.appendChild(row);
        }
    }

    function fail() {
        list.innerHTML = '<div class="error">Etkinlik takvimi yüklenemedi.</div>';
    }

    var xhr = new XMLHttpRequest();
    xhr.open("GET", "etkinlikler.json?v=" + new Date().getTime(), true);
    xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        if (xhr.status >= 200 && xhr.status < 300) {
            try { render(JSON.parse(xhr.responseText)); }
            catch (e) { fail(); }
        } else {
            fail();
        }
    };
    xhr.send(null);
}());
</script>
</body>
</html>
