<!DOCTYPE html><html lang='tr'><head><meta charset='utf-8'>
<meta http-equiv="X-UA-Compatible" content="IE=9">
<style>
html,body{margin:0;padding:0;width:228px;height:210px;overflow:hidden;background:#080604;font-family:Arial}
.wrap{width:228px;height:210px;border:1px solid #6f6038;background:#11100e;box-sizing:border-box;padding:5px}
.title{height:20px;line-height:18px;color:#d9bf6d;border-bottom:1px solid #816d3d;font-size:12px}
.row{position:relative;height:22px;margin-top:3px;background:#1d1d1c;border-bottom:1px solid #806d3b}
.name{position:absolute;left:6px;top:5px;width:110px;overflow:hidden;white-space:nowrap;color:#e0c55e;font-size:9px}
.when{position:absolute;right:4px;top:3px;background:#9a8449;color:#17130c;padding:2px 4px;font-size:8px;white-space:nowrap}
</style></head><body><div class='wrap'><div class='title'>Etkinlik Takvimi</div><div id='list'></div></div>
<script>
var x=new XMLHttpRequest();
x.open('GET','etkinlikler.json?'+Date.now(),true);
x.onreadystatechange=function(){
if(x.readyState!=4)return;
var l=document.getElementById('list');
try{
var d=JSON.parse(x.responseText),h='';
for(var i=0;i<d.length&&i<7;i++){
h+="<div class='row'><div class='name'>"+d[i].name+"</div><div class='when'>"+d[i].day+" "+d[i].time+"</div></div>";
}
l.innerHTML=h;
}catch(e){l.innerHTML='Yüklenemedi';}
};
x.send();
</script></body></html>
