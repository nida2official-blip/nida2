    function clean(value) {
        value = String(value);
        value = value.replace(/&/g, "&amp;");
        value = value.replace(/</g, "&lt;");
        value = value.replace(/>/g, "&gt;");
        value = value.replace(/"/g, "&quot;");
        return value;
    }

    function draw(data) {
        var html = "";
        var i, item, icon;

        for (i = 0; i < data.length && i < 7; i++) {
            item = data[i];
            icon = iconMap[item.icon] || iconMap.sun;

            html += '<div class="eventRow">';
            html += '<img class="eventIcon" src="' + icon + '" alt="">';
            html += '<div class="eventName">' + clean(item.name) + '</div>';
            html += '<div class="eventTime">' +
                    clean(item.day) + ' ' +
                    clean(item.time) +
                    '</div>';
            html += '</div>';
        }

        list.innerHTML = html;
    }

    function showError() {
        list.innerHTML = '<div id="error">Etkinlikler yüklenemedi.</div>';
    }

    try {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "etkinlikler.json?x=" + new Date().getTime(), true);

        xhr.onreadystatechange = function () {
            if (xhr.readyState != 4) {
                return;
            }

            if (xhr.status == 200 || xhr.status == 0) {
                try {
                    draw(JSON.parse(xhr.responseText));
                } catch (error) {
                    showError();
                }
            } else {
                showError();
            }
        };

        xhr.send(null);
    } catch (error) {
        showError();
    }
}());
</script>
