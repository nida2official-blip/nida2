<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=235, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Legan2 Duyurular</title>

    <style>
        html, body {
            width: 222px;
            height: 103px;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #080604;
            font-family: Georgia, "Times New Roman", serif;
        }

        * {
            box-sizing: border-box;
        }

        .notices {
            width: 222px;
            height: 103px;
            padding: 5px 7px;
            overflow: hidden;
            background: #080604;
        }

        .notices h2 {
            height: 21px;
            margin: 0 0 3px 0;
            padding: 0 0 2px 0;
            color: #edc35c;
            font-size: 14px;
            line-height: 18px;
            letter-spacing: 1px;
            border-bottom: 1px solid #60451d;
        }

        .notice-item {
            position: relative;
            height: 18px;
            padding-left: 13px;
            padding-right: 62px;
            overflow: hidden;
            color: #e6b949;
            font-size: 10px;
            font-weight: bold;
            line-height: 18px;
            white-space: nowrap;
        }

        .bullet {
            position: absolute;
            left: 1px;
            top: 0;
            color: #c58b29;
            font-size: 9px;
        }

        .title {
            display: block;
            overflow: hidden;
            color: #e6b949;
            text-decoration: none;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .title:hover {
            color: #fff0a0;
        }

        .date {
            position: absolute;
            right: 1px;
            top: 0;
            width: 58px;
            color: #c7a769;
            font-size: 8px;
            font-weight: normal;
            text-align: right;
        }

        .message {
            padding-top: 18px;
            color: #b99a5d;
            font-size: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="notices">
    <h2>DUYURULAR</h2>
    <div id="notice-list">
        <div class="message">Duyurular yükleniyor...</div>
    </div>
</div>

<script type="text/javascript">
(function () {
    var container = document.getElementById("notice-list");

    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function safeLink(value) {
        var link = String(value || "#");
        return /^(https?:\/\/|#)/i.test(link) ? escapeHtml(link) : "#";
    }

    function render(items) {
        if (!items || !items.length) {
            container.innerHTML = '<div class="message">Henüz duyuru yok.</div>';
            return;
        }

        var html = "";
        var limit = Math.min(items.length, 4);

        for (var i = 0; i < limit; i++) {
            var item = items[i] || {};
            var title = escapeHtml(item.baslik || "Duyuru");
            var date = escapeHtml(item.tarih || "");
            var link = safeLink(item.link);

            html +=
                '<div class="notice-item">' +
                    '<span class="bullet">◆</span>' +
                    '<a class="title" href="' + link + '" target="_blank" title="' + title + '">' +
                        title +
                    '</a>' +
                    '<span class="date">[' + date + ']</span>' +
                '</div>';
        }

        container.innerHTML = html;
    }

    function showError() {
        container.innerHTML = '<div class="message">Duyurular yüklenemedi.</div>';
    }

    var xhr = new XMLHttpRequest();
    xhr.open("GET", "duyurular.json?v=" + new Date().getTime(), true);

    xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;

        if (xhr.status >= 200 && xhr.status < 300) {
            try {
                render(JSON.parse(xhr.responseText));
            } catch (e) {
                showError();
            }
        } else {
            showError();
        }
    };

    xhr.send(null);
})();
</script>
</body>
</html>
