<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=800, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Legan2 Launcher</title>

    <link rel="stylesheet" href="assets/frontend/css/base.css">

<body>

                <a href="https://www.facebook.com/serversayfa" target="_blank" title="Facebook">
                    <img src="assets/pack/img/icon/facebook.png" alt="Facebook">

                <a href="https://www.instagram.com/serverinsta" target="_blank" title="Instagram">
                    <img src="assets/pack/img/icon/instagram.png" alt="Instagram">
                </a>
                <a href="https://discord.gg/serveradi" target="_blank" title="Discord">
                    <img src="assets/pack/img/icon/discord.png" alt="Discord">
                </a>
            </nav>
        </header>

        <section class="bottom-panels">


            <article class="panel calendar">
                <h2>
                    <img src="assets/pack/img/icon/takvim.png" alt="">

                <p><strong>Her gün</strong> düzenli etkinlikler ve özel ödüller.</p>
